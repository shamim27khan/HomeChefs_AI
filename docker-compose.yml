version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: homechefs_db
    environment:
      POSTGRES_DB: homechefs_ai
      POSTGRES_USER: homechefs
      POSTGRES_PASSWORD: ${DB_PASSWORD:-homechefs123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homechefs -d homechefs_ai"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: homechefs_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homechefs_web
    environment:
      - DJANGO_SETTINGS_MODULE=HomeChefs.settings_production
      - DATABASE_URL=postgres://homechefs:${DB_PASSWORD:-homechefs123}@db:5432/homechefs_ai
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/mediafiles
      - logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: homechefs_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - staticfiles:/app/staticfiles
      - mediafiles:/app/mediafiles
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homechefs_celery
    command: celery -A HomeChefs worker --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=HomeChefs.settings_production
      - DATABASE_URL=postgres://homechefs:${DB_PASSWORD:-homechefs123}@db:5432/homechefs_ai
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
    volumes:
      - logs:/app/logs
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homechefs_celery_beat
    command: celery -A HomeChefs beat --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=HomeChefs.settings_production
      - DATABASE_URL=postgres://homechefs:${DB_PASSWORD:-homechefs123}@db:5432/homechefs_ai
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
    volumes:
      - logs:/app/logs
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  mediafiles:
  logs:

networks:
  default:
    driver: bridge
