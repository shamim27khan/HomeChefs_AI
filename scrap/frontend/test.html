<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeChefs API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>HomeChefs API Test</h1>
    
    <div class="test-section">
        <h2>1. Test Public Chefs API</h2>
        <button onclick="testChefs()">Test Chefs API</button>
        <div id="chefsResult"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Test Food Search API</h2>
        <button onclick="testFood()">Test Food API</button>
        <div id="foodResult"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Test Login API</h2>
        <button onclick="testLogin()">Test Login API</button>
        <div id="loginResult"></div>
    </div>
    
    <div class="test-section">
        <h2>4. Test Registration API</h2>
        <button onclick="testRegister()">Test Register API</button>
        <div id="registerResult"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        
        async function testChefs() {
            const resultDiv = document.getElementById('chefsResult');
            resultDiv.innerHTML = '<p>Loading...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/chefs/public/`);
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="success">
                        <h3>✅ Success - Status: ${response.status}</h3>
                        <p>Found ${data.length} chefs</p>
                        <pre>${JSON.stringify(data.slice(0, 1), null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function testFood() {
            const resultDiv = document.getElementById('foodResult');
            resultDiv.innerHTML = '<p>Loading...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/customers/search/food/`);
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="success">
                        <h3>✅ Success - Status: ${response.status}</h3>
                        <p>Found ${data.length} food items</p>
                        <pre>${JSON.stringify(data.slice(0, 1), null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function testLogin() {
            const resultDiv = document.getElementById('loginResult');
            resultDiv.innerHTML = '<p>Loading...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/auth/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'customer_anjali',
                        password: 'customer123'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Login Successful</h3>
                            <p>User: ${data.user.username}</p>
                            <p>Role: ${data.user.role}</p>
                            <p>Token: ${data.token.substring(0, 20)}...</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Login Failed</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function testRegister() {
            const resultDiv = document.getElementById('registerResult');
            resultDiv.innerHTML = '<p>Loading...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/auth/register/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'testuser' + Date.now(),
                        email: 'test@example.com',
                        password: 'test12345',
                        confirm_password: 'test12345',
                        first_name: 'Test',
                        last_name: 'User',
                        role: 'customer'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Registration Successful</h3>
                            <p>User: ${data.user.username}</p>
                            <p>Token: ${data.token.substring(0, 20)}...</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Registration Failed</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        // Auto-test on page load
        window.onload = function() {
            setTimeout(() => {
                testChefs();
                setTimeout(() => {
                    testFood();
                }, 1000);
            }, 500);
        };
    </script>
</body>
</html>
