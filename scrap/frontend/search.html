<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - HomeChefs</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #e23744;
            --secondary-color: #2d2d2d;
            --accent-color: #ff6b6b;
            --text-light: #6c757d;
            --border-light: #e9ecef;
            --bg-light: #f8f9fa;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--secondary-color);
            line-height: 1.6;
            background: var(--bg-light);
        }

        /* Navigation */
        .navbar {
            background: white;
            box-shadow: var(--shadow-sm);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary-color) !important;
            display: flex;
            align-items: center;
        }

        .navbar-brand i {
            margin-right: 8px;
            font-size: 1.8rem;
        }

        .nav-link {
            color: var(--secondary-color) !important;
            font-weight: 500;
            margin: 0 8px;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: var(--primary-color) !important;
        }

        /* Search Header */
        .search-header {
            background: white;
            padding: 30px 0;
            box-shadow: var(--shadow-sm);
            margin-bottom: 30px;
        }

        .search-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .search-input {
            border: 2px solid var(--border-light);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(226, 55, 68, 0.1);
        }

        /* Filters Sidebar */
        .filters-sidebar {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .filter-section {
            margin-bottom: 32px;
        }

        .filter-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: var(--secondary-color);
        }

        .filter-option {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-option:hover {
            color: var(--primary-color);
        }

        .filter-option input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .price-range {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .price-input {
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 8px 12px;
            width: 100px;
            font-size: 14px;
        }

        /* Results Section */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .results-count {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .sort-dropdown {
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 8px 16px;
            background: white;
            cursor: pointer;
        }

        /* Food Cards */
        .food-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: all 0.3s;
            border: 1px solid var(--border-light);
            margin-bottom: 24px;
        }

        .food-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .food-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            position: relative;
        }

        .food-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--primary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .food-info {
            padding: 20px;
        }

        .food-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .food-description {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .food-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .chef-name {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .rating {
            color: #ffc107;
            font-weight: 600;
        }

        .food-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .food-price {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--primary-color);
        }

        .add-to-cart {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-to-cart:hover {
            background: var(--accent-color);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid var(--border-light);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 60px 20px;
        }

        .no-results i {
            font-size: 4rem;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .no-results h3 {
            color: var(--secondary-color);
            margin-bottom: 12px;
        }

        .no-results p {
            color: var(--text-light);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .filters-sidebar {
                position: static;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-utensils"></i>
                HomeChefs
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index_zomato_style.html#chefs">Chefs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index_zomato_style.html#food">Food</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showLoginModal()">
                            <i class="fas fa-user me-1"></i>Login
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link position-relative" href="#">
                            <i class="fas fa-shopping-cart"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                0
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Search Header -->
    <div class="search-header">
        <div class="container">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Search for food, dishes, or chefs...">
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="row">
            <!-- Filters Sidebar -->
            <div class="col-lg-3">
                <div class="filters-sidebar">
                    <div class="filter-section">
                        <div class="filter-title">Cuisine Type</div>
                        <div class="filter-option">
                            <input type="checkbox" id="north-indian" checked>
                            <label for="north-indian">North Indian</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="south-indian" checked>
                            <label for="south-indian">South Indian</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="chinese" checked>
                            <label for="chinese">Chinese</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="continental" checked>
                            <label for="continental">Continental</label>
                        </div>
                    </div>

                    <div class="filter-section">
                        <div class="filter-title">Dietary Preference</div>
                        <div class="filter-option">
                            <input type="checkbox" id="vegetarian">
                            <label for="vegetarian">Vegetarian</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="non-vegetarian">
                            <label for="non-vegetarian">Non-Vegetarian</label>
                        </div>
                    </div>

                    <div class="filter-section">
                        <div class="filter-title">Price Range</div>
                        <div class="price-range">
                            <input type="number" class="price-input" id="minPrice" placeholder="Min" min="0">
                            <span>to</span>
                            <input type="number" class="price-input" id="maxPrice" placeholder="Max" min="0">
                        </div>
                    </div>

                    <div class="filter-section">
                        <div class="filter-title">Meal Type</div>
                        <div class="filter-option">
                            <input type="checkbox" id="breakfast">
                            <label for="breakfast">Breakfast</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="lunch">
                            <label for="lunch">Lunch</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="dinner">
                            <label for="dinner">Dinner</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="snacks">
                            <label for="snacks">Snacks</label>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100" onclick="applyFilters()">
                        Apply Filters
                    </button>
                </div>
            </div>

            <!-- Results -->
            <div class="col-lg-9">
                <div class="results-header">
                    <div class="results-count" id="resultsCount">
                        Loading results...
                    </div>
                    <select class="sort-dropdown" id="sortDropdown" onchange="sortResults()">
                        <option value="relevance">Sort by: Relevance</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Rating</option>
                        <option value="delivery-time">Delivery Time</option>
                    </select>
                </div>

                <div id="resultsContainer">
                    <!-- Results will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script>
        // API Base URL
        const API_BASE = 'http://127.0.0.1:8000/api';
        let allFoodItems = [];
        let filteredFoodItems = [];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q') || '';
            const cuisine = urlParams.get('cuisine') || '';
            
            document.getElementById('searchInput').value = query;
            
            if (cuisine) {
                // Pre-select cuisine filter
                const checkbox = document.getElementById(cuisine.toLowerCase().replace(' ', '-'));
                if (checkbox) checkbox.checked = true;
            }
            
            loadFoodItems(query);
        });

        // Load food items
        async function loadFoodItems(query = '') {
            try {
                showLoading();
                const response = await fetch(`${API_BASE}/customers/search/food/?q=${encodeURIComponent(query)}`);
                allFoodItems = await response.json();
                filteredFoodItems = [...allFoodItems];
                applyFilters();
            } catch (error) {
                console.error('Error loading food items:', error);
                showError('Failed to load food items. Please try again later.');
            }
        }

        // Apply filters
        function applyFilters() {
            const cuisineFilters = {
                'north-indian': 'North Indian',
                'south-indian': 'South Indian',
                'chinese': 'Chinese',
                'continental': 'Continental'
            };

            const mealTypeFilters = {
                'breakfast': 'breakfast',
                'lunch': 'lunch',
                'dinner': 'dinner',
                'snacks': 'snacks'
            };

            // Start with all items
            filteredFoodItems = [...allFoodItems];

            // Apply cuisine filters
            const activeCuisineFilters = Object.keys(cuisineFilters).filter(id => 
                document.getElementById(id).checked
            );
            
            if (activeCuisineFilters.length > 0) {
                filteredFoodItems = filteredFoodItems.filter(item => 
                    activeCuisineFilters.some(filterId => 
                        item.cuisine_type === cuisineFilters[filterId]
                    )
                );
            }

            // Apply dietary preference
            const vegetarianOnly = document.getElementById('vegetarian').checked;
            const nonVegetarianOnly = document.getElementById('non-vegetarian').checked;
            
            if (vegetarianOnly && !nonVegetarianOnly) {
                filteredFoodItems = filteredFoodItems.filter(item => item.is_vegetarian);
            } else if (nonVegetarianOnly && !vegetarianOnly) {
                filteredFoodItems = filteredFoodItems.filter(item => !item.is_vegetarian);
            }

            // Apply meal type filters
            const activeMealFilters = Object.keys(mealTypeFilters).filter(id => 
                document.getElementById(id).checked
            );
            
            if (activeMealFilters.length > 0) {
                filteredFoodItems = filteredFoodItems.filter(item => 
                    activeMealFilters.some(filterId => 
                        item.meal_type === mealTypeFilters[filterId]
                    )
                );
            }

            // Apply price range
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;
            
            filteredFoodItems = filteredFoodItems.filter(item => {
                const price = parseFloat(item.price);
                return price >= minPrice && price <= maxPrice;
            });

            displayResults();
        }

        // Sort results
        function sortResults() {
            const sortBy = document.getElementById('sortDropdown').value;
            
            switch(sortBy) {
                case 'price-low':
                    filteredFoodItems.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
                    break;
                case 'price-high':
                    filteredFoodItems.sort((a, b) => parseFloat(b.price) - parseFloat(a.price));
                    break;
                case 'rating':
                    filteredFoodItems.sort((a, b) => (b.rating || 0) - (a.rating || 0));
                    break;
                case 'delivery-time':
                    filteredFoodItems.sort((a, b) => (a.preparation_time || 999) - (b.preparation_time || 999));
                    break;
                default:
                    // Relevance - keep original order
                    break;
            }
            
            displayResults();
        }

        // Display results
        function displayResults() {
            const container = document.getElementById('resultsContainer');
            const countElement = document.getElementById('resultsCount');
            
            countElement.textContent = `${filteredFoodItems.length} results found`;
            
            if (filteredFoodItems.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>No results found</h3>
                        <p>Try adjusting your filters or search terms</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredFoodItems.map(food => `
                <div class="food-card">
                    <div class="position-relative">
                        <img src="https://via.placeholder.com/300x200/667eea/ffffff?text=${food.name}" 
                             alt="${food.name}" class="food-image">
                        <span class="food-badge">${food.is_vegetarian ? '🌱 Veg' : '🍖 Non-Veg'}</span>
                    </div>
                    <div class="food-info">
                        <div class="food-name">${food.name}</div>
                        <div class="food-description">${food.description}</div>
                        <div class="food-meta">
                            <div class="chef-name">by ${food.chef ? food.chef.first_name : 'Home Chef'}</div>
                            <div class="rating">
                                <i class="fas fa-star"></i> ${food.rating || '4.5'}
                            </div>
                        </div>
                        <div class="food-footer">
                            <div class="food-price">₹${food.price}</div>
                            <button class="add-to-cart" onclick="addToCart(${food.id})">
                                <i class="fas fa-plus"></i> Add
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Show loading
        function showLoading() {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p class="mt-3">Loading delicious food...</p>
                </div>
            `;
        }

        // Show error
        function showError(message) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = `
                <div class="no-results">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>Oops!</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // Add to cart
        function addToCart(foodId) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            const existingItem = cart.find(item => item.food_id === foodId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ food_id: foodId, quantity: 1 });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            showSuccess('Item added to cart!');
        }

        // Update cart count
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const count = cart.reduce((total, item) => total + item.quantity, 0);
            const cartBadge = document.querySelector('.badge');
            if (cartBadge) {
                cartBadge.textContent = count;
            }
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.className = 'alert alert-success position-fixed top-0 start-50 translate-middle-x mt-3';
            successDiv.style.zIndex = '9999';
            successDiv.textContent = message;
            document.body.appendChild(successDiv);
            
            setTimeout(() => {
                successDiv.remove();
            }, 3000);
        }

        // Handle Enter key in search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = e.target.value.trim();
                window.location.href = `search.html?q=${encodeURIComponent(query)}`;
            }
        });

        // Initialize cart count
        updateCartCount();
        
        // Authentication Functions
        function showLoginModal() {
            // Redirect to login page
            window.location.href = '/login/';
        }
        
        function showRegisterModal() {
            // Redirect to register page
            window.location.href = '/register/';
        }
        
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} position-fixed top-0 start-50 translate-middle-x mt-3`;
            alertDiv.style.zIndex = '9999';
            alertDiv.textContent = message;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }
        
        // Check authentication status
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('authToken');
            const userStr = localStorage.getItem('user');
            
            if (token && userStr) {
                try {
                    const user = JSON.parse(userStr);
                    // Update login button to show username
                    const loginBtn = document.querySelector('a[onclick="showLoginModal()"]');
                    if (loginBtn) {
                        loginBtn.innerHTML = `<i class="fas fa-user me-1"></i>${user.username}`;
                        loginBtn.onclick = () => showAlert('Already logged in', 'info');
                    }
                } catch (e) {
                    console.error('Error parsing user data:', e);
                }
            }
        });
    </script>
</body>
</html>
