<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - HomeChefs</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #e23744;
            --secondary-color: #2d2d2d;
            --accent-color: #ff6b6b;
            --text-light: #6c757d;
            --border-light: #e9ecef;
            --bg-light: #f8f9fa;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--secondary-color);
            line-height: 1.6;
            background: var(--bg-light);
        }

        /* Navigation */
        .navbar {
            background: white;
            box-shadow: var(--shadow-sm);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary-color) !important;
            display: flex;
            align-items: center;
        }

        .navbar-brand i {
            margin-right: 8px;
            font-size: 1.8rem;
        }

        .nav-link {
            color: var(--secondary-color) !important;
            font-weight: 500;
            margin: 0 8px;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: var(--primary-color) !important;
        }

        /* Cart Container */
        .cart-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .cart-header {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }

        .cart-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-count {
            background: var(--primary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Cart Content */
        .cart-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 24px;
        }

        .cart-items {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }

        .cart-item {
            display: flex;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-image {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--bg-light);
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .item-description {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .item-price {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border-light);
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quantity-btn:hover {
            background: var(--bg-light);
            border-color: var(--primary-color);
        }

        .quantity-input {
            width: 50px;
            height: 32px;
            text-align: center;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            font-weight: 600;
        }

        .remove-item {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            transition: color 0.3s;
        }

        .remove-item:hover {
            color: var(--primary-color);
        }

        /* Order Summary */
        .order-summary {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .summary-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .summary-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .summary-label {
            color: var(--text-light);
        }

        .summary-value {
            font-weight: 600;
        }

        .summary-total {
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .promo-section {
            margin: 24px 0;
            padding: 16px;
            background: var(--bg-light);
            border-radius: 8px;
        }

        .promo-input {
            width: 100%;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .promo-btn {
            width: 100%;
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .promo-btn:hover {
            background: var(--primary-color);
        }

        .checkout-btn {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            background: var(--accent-color);
            transform: translateY(-2px);
        }

        .checkout-btn:disabled {
            background: var(--text-light);
            cursor: not-allowed;
            transform: none;
        }

        /* Empty Cart */
        .empty-cart {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
        }

        .empty-cart i {
            font-size: 4rem;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        .empty-cart h3 {
            font-size: 1.5rem;
            margin-bottom: 16px;
        }

        .empty-cart p {
            color: var(--text-light);
            margin-bottom: 32px;
        }

        .continue-shopping-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .continue-shopping-btn:hover {
            background: var(--accent-color);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 992px) {
            .cart-content {
                grid-template-columns: 1fr;
            }

            .order-summary {
                position: static;
            }
        }

        @media (max-width: 576px) {
            .cart-item {
                flex-direction: column;
                gap: 12px;
            }

            .item-image {
                width: 100%;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-utensils"></i>
                HomeChefs
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index_zomato_style.html#chefs">Chefs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index_zomato_style.html#food">Food</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showLoginModal()">
                            <i class="fas fa-user me-1"></i>Login
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link position-relative" href="cart.html">
                            <i class="fas fa-shopping-cart"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                0
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Cart Container -->
    <div class="cart-container">
        <!-- Cart Header -->
        <div class="cart-header">
            <div class="cart-title">
                <i class="fas fa-shopping-cart"></i>
                Shopping Cart
                <span class="cart-count" id="cartItemCount">0 items</span>
            </div>
        </div>

        <!-- Cart Content -->
        <div class="cart-content" id="cartContent">
            <!-- Cart items will be loaded here -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script>
        // API Base URL
        const API_BASE = 'http://127.0.0.1:8000/api';
        let cartItems = [];
        let foodDetails = {};

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadCart();
            updateCartCount();
        });

        // Load cart from localStorage
        function loadCart() {
            cartItems = JSON.parse(localStorage.getItem('cart') || '[]');
            
            if (cartItems.length === 0) {
                displayEmptyCart();
            } else {
                loadFoodDetails();
            }
        }

        // Load food details for cart items
        async function loadFoodDetails() {
            try {
                // Get all food details
                const response = await fetch(`${API_BASE}/customers/search/food/`);
                const allFoods = await response.json();
                
                // Create a map of food details
                allFoods.forEach(food => {
                    foodDetails[food.id] = food;
                });
                
                displayCart();
            } catch (error) {
                console.error('Error loading food details:', error);
                showError('Failed to load cart items.');
            }
        }

        // Display cart
        function displayCart() {
            const container = document.getElementById('cartContent');
            
            const cartItemsHtml = cartItems.map(item => {
                const food = foodDetails[item.food_id];
                if (!food) return '';
                
                return `
                    <div class="cart-item">
                        <img src="https://via.placeholder.com/100x100/667eea/ffffff?text=${food.name}" 
                             alt="${food.name}" class="item-image">
                        <div class="item-details">
                            <div class="item-name">${food.name}</div>
                            <div class="item-description">${food.description}</div>
                            <div class="item-meta">
                                <div class="item-price">₹${food.price}</div>
                                <div class="quantity-controls">
                                    <button class="quantity-btn" onclick="updateQuantity(${item.food_id}, -1)">
                                        <i class="fas fa-minus"></i>
                                    </button>
                                    <input type="number" class="quantity-input" value="${item.quantity}" 
                                           onchange="setQuantity(${item.food_id}, this.value)" min="1">
                                    <button class="quantity-btn" onclick="updateQuantity(${item.food_id}, 1)">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                            <button class="remove-item" onclick="removeFromCart(${item.food_id})">
                                <i class="fas fa-trash"></i> Remove
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            const orderSummary = generateOrderSummary();
            
            container.innerHTML = `
                <div class="cart-items">
                    ${cartItemsHtml}
                </div>
                <div class="order-summary">
                    ${orderSummary}
                </div>
            `;
        }

        // Generate order summary
        function generateOrderSummary() {
            let subtotal = 0;
            let deliveryFee = 40;
            let tax = 0;
            
            cartItems.forEach(item => {
                const food = foodDetails[item.food_id];
                if (food) {
                    subtotal += parseFloat(food.price) * item.quantity;
                }
            });
            
            tax = subtotal * 0.05; // 5% tax
            const total = subtotal + deliveryFee + tax;
            
            return `
                <div class="summary-title">Order Summary</div>
                
                <div class="summary-row">
                    <span class="summary-label">Subtotal</span>
                    <span class="summary-value">₹${subtotal.toFixed(2)}</span>
                </div>
                
                <div class="summary-row">
                    <span class="summary-label">Delivery Fee</span>
                    <span class="summary-value">₹${deliveryFee.toFixed(2)}</span>
                </div>
                
                <div class="summary-row">
                    <span class="summary-label">Tax (5%)</span>
                    <span class="summary-value">₹${tax.toFixed(2)}</span>
                </div>
                
                <div class="summary-row">
                    <span class="summary-label">Total</span>
                    <span class="summary-value summary-total">₹${total.toFixed(2)}</span>
                </div>
                
                <div class="promo-section">
                    <input type="text" class="promo-input" placeholder="Enter promo code">
                    <button class="promo-btn" onclick="applyPromo()">Apply</button>
                </div>
                
                <button class="checkout-btn" onclick="proceedToCheckout()" ${cartItems.length === 0 ? 'disabled' : ''}>
                    Proceed to Checkout <i class="fas fa-arrow-right ms-2"></i>
                </button>
            `;
        }

        // Display empty cart
        function displayEmptyCart() {
            const container = document.getElementById('cartContent');
            container.innerHTML = `
                <div class="empty-cart">
                    <i class="fas fa-shopping-cart"></i>
                    <h3>Your cart is empty</h3>
                    <p>Looks like you haven't added any delicious items yet!</p>
                    <a href="index_zomato_style.html" class="continue-shopping-btn">
                        <i class="fas fa-arrow-left me-2"></i>Continue Shopping
                    </a>
                </div>
            `;
        }

        // Update quantity
        function updateQuantity(foodId, change) {
            const item = cartItems.find(item => item.food_id === foodId);
            if (item) {
                item.quantity += change;
                if (item.quantity < 1) {
                    item.quantity = 1;
                }
                saveCart();
                displayCart();
            }
        }

        // Set quantity
        function setQuantity(foodId, quantity) {
            const item = cartItems.find(item => item.food_id === foodId);
            if (item) {
                item.quantity = Math.max(1, parseInt(quantity) || 1);
                saveCart();
                displayCart();
            }
        }

        // Remove from cart
        function removeFromCart(foodId) {
            cartItems = cartItems.filter(item => item.food_id !== foodId);
            saveCart();
            updateCartCount();
            
            if (cartItems.length === 0) {
                displayEmptyCart();
            } else {
                displayCart();
            }
            
            showSuccess('Item removed from cart');
        }

        // Save cart to localStorage
        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cartItems));
            updateCartCount();
        }

        // Update cart count
        function updateCartCount() {
            const count = cartItems.reduce((total, item) => total + item.quantity, 0);
            const cartBadge = document.querySelector('.badge');
            const itemCountElement = document.getElementById('cartItemCount');
            
            if (cartBadge) {
                cartBadge.textContent = count;
            }
            if (itemCountElement) {
                itemCountElement.textContent = `${count} items`;
            }
        }

        // Apply promo code
        function applyPromo() {
            const promoInput = document.querySelector('.promo-input');
            const promoCode = promoInput.value.trim();
            
            if (!promoCode) {
                showError('Please enter a promo code');
                return;
            }
            
            // Here you would typically validate the promo code with your backend
            showSuccess(`Promo code "${promoCode}" applied!`);
            promoInput.value = '';
        }

        // Proceed to checkout
        function proceedToCheckout() {
            if (cartItems.length === 0) {
                showError('Your cart is empty');
                return;
            }
            
            // Check if user is logged in
            const token = localStorage.getItem('authToken');
            if (!token) {
                // Redirect to login with return URL
                window.location.href = `login.html?redirect=checkout`;
            } else {
                // Proceed to checkout
                window.location.href = 'checkout.html';
            }
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.className = 'alert alert-success position-fixed top-0 start-50 translate-middle-x mt-3';
            successDiv.style.zIndex = '9999';
            successDiv.textContent = message;
            document.body.appendChild(successDiv);
            
            setTimeout(() => {
                successDiv.remove();
            }, 3000);
        }

        // Show error
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'alert alert-danger position-fixed top-0 start-50 translate-middle-x mt-3';
            errorDiv.style.zIndex = '9999';
            errorDiv.textContent = message;
            document.body.appendChild(errorDiv);
            
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }
    </script>
</body>
</html>
